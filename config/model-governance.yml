# Local pin of harness model-governance defaults for Perpetua-Tools.
# Canonical standard (do not copy wholesale):
# https://github.com/oramasys/alexandria/blob/docs/mig-pack-ingest-20260925/docs/standards/model-governance.md
# alexandria PR #1, tip d6da6781
#
# This file does not reorder the runtime frugality ladder (local tiers first).
# Cost gate stays fail-closed. Cloud escalation stays default-deny.
# Config flags in this file are NOT an escalation token.

version: 1
canonical:
  url: https://github.com/oramasys/alexandria/blob/docs/mig-pack-ingest-20260925/docs/standards/model-governance.md
  pull_request: https://github.com/oramasys/alexandria/pull/1
  tip: d6da6781

invariants:
  cost_gate: fail_closed
  cloud_escalation: default_deny
  harness_decides_path: true
  agents_never_self_escalate: true
  auto_is_editor_only: true

# None of these count as an escalation token (S-AuthZ bearer + fresh signed HITL).
not_escalation_token:
  - config_flag
  - env_var
  - agent_writable_file
  - cached_approval

banned_launch_ids:
  - gpt-6-astra
  - grok-4.5
  - grok-4.6

cursor_grok_bot:
  default:
    usage_label: cursor-grok-4.7-medium
    launch_id: grok-4.7
    effort: medium
    fast: false
  allowed_ungated:
    - launch_id: composer-2.5
      fast: false
    # Official OpenAI id (developers.openai.com/api/docs/models/gpt-5.6-terra);
    # replaces the retired gpt-5.3-codex-low examples. Explicit operator pick.
    - launch_id: gpt-5.6-terra
      effort: medium
      fast: false
  gated: {}

anthropic:
  default:
    launch_id: claude-sonnet-5-5
    legacy_pin: claude-sonnet-5
    effort: medium
  controller:
    launch_id: claude-haiku-5-5
    effort: medium
    fast: false
  planning:
    launch_id: claude-opus-5-5
    effort: high
    allowed_efforts: [medium, high]
    fast: false
  gated:
    claude-opus-5-5:
      effort: medium
      allowed_efforts: [medium, high]
      fast: false
      requires: escalation_token
    claude-fable-5-1:
      effort: medium
      requires:
        - escalation_token
        - budget_cap

direct_xai:
  default:
    launch_id: grok-4.7
    reasoning_effort: medium
    fast: false

openai:
  default:
    launch_id: gpt-5.6-terra
    effort: medium
    fast: false
  controller:
    launch_id: gpt-6-luna
    effort: medium
    fast: false
  planning:
    launch_id: gpt-6.1-sol
    effort: medium
    fast: false

google:
  default:
    launch_id: gemini-3.8-flash
    effort: medium
    fast: false

# ClinePass subscription provider (harness path: cline_pass).
# Official lineup and model ids: https://docs.cline.bot/getting-started/clinepass
# The wire id is cline-pass/<launch_id>; this file pins the bare launch id.
# Registering the provider does not loosen the cost gate: `gated` stays empty,
# so nothing on this path is reachable except the rows written out below.
cline_pass:
  default:
    launch_id: deepseek-v4.1-flash-1017
    # The official Cline client offers off/low/high/max for DeepSeek V4.1
    # Flash (not medium), and `max` is forbidden by this repo's policy, so the
    # pinned default is the nearest permitted documented level.
    effort: low
    fast: false
  allowed_ungated:
    - launch_id: muse-spark-1.3-contributor
      # Cline documents the id but publishes no per-model effort table for it;
      # medium is the repo-standard default and stays open to operator review.
      effort: medium
      fast: false
  gated: {}

allowed_escalation_proof_kinds:
  - github_verified_signoff
  - offline_gpg
  - control_plane_online_signer
