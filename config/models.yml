# Model registry — per-device and per-backend configuration.
# Top-level agents (Mac + Win) select via SKILL.md → ModelRegistry first.
# Subagents use ECC-tools default logic unless parent overrides role assignment.
# priority: lower number = preferred. Local models before online models.

version: "0.9.9.8"

models:

  # ── Priority 1 - Top Orchestrator on Mac ──────────────────────────────────
  - name: "glm-5.3-flash:cloud"
    backend: ollama
    device: mac-studio
    host: "${OLLAMA_HOST:-http://127.0.0.1}"
    port: 11434
    priority: 1
    online: true
    status: "🟢 Primary"
    roles:
      - "top-level"
      - "long_context"
      - "strategy"
      - "general"
      - "deep_reasoning"
    description: "Top Orchestrator - Cloud-Local Hybrid"
    tier: "primary"
    # frugality_tier=4 (free_proprietary): ":cloud" suffix routes through
    # Ollama's hosted cloud gateway (not local weights) -- not local_oss,
    # but no per-token paid API key is configured for it in this repo
    # (unlike glm-5.3-flash/anthropic/perplexity/xai below), so it is classified
    # as proprietary-hosted rather than tier-5 paid. Judgment call -- see
    # PT survey report for the reconciliation session that landed this.
    frugality_tier: 4

  # ── Ollama cloud free tier: Reflection Beam ───────────────────────────────
  - name: "beam:cloud"
    backend: ollama
    device: mac-studio
    host: "${OLLAMA_HOST:-http://localhost}"
    port: 11434
    priority: 11
    online: true
    status: "🟡 Free (limited time)"
    roles:
      - "long_context"
      - "general"
      - "deep_reasoning"
    description: "Reflection Beam via Ollama cloud — 501B MoE, 1M context"
    # frugality_tier=4 (free_proprietary): same class as glm-5.3-flash:cloud above -- the
    # ":cloud" suffix routes through Ollama's hosted gateway, not local weights, and no
    # per-token key is configured for it here. Ollama announced Beam as free for a limited
    # time; re-check its terms before relying on it. priority 11 ranks it after every current
    # first choice (<= 10), so it only takes over when those are unavailable.
    frugality_tier: 4

  # ── ONLINE: BigModel / Zhipu glm-5.3-flash (cloud, OpenAI-compatible, thinking) ─
  # Endpoint: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # Key: ${OPENCLAW_MODELS_PROVIDERS_BIGMODEL_APIKEY} (gitignored .env.local)
  - name: "glm-5.3-flash"
    api_model: "glm-5.3-flash"
    backend: bigmodel
    device: cloud
    host: "https://open.bigmodel.cn"
    port: 443
    api_path: "/api/paas/v4/chat/completions"
    context_window: 131072
    max_tokens: 65536
    temperature: 1.0
    thinking:
      type: enabled
    roles: [top-level, long_context, strategy, general, reasoning, autoresearch]
    priority: 2
    online: true
    reasoning: cloud-thinking
    description: "glm-5.3-flash cloud (BigModel/Zhipu) — thinking-enabled, 131k context"
    tier: "primary"
    # NOTE (2026-11-04 rename glm-5.2 -> glm-5.3-flash): verified_on, context_window, max_tokens
    # and source_url below predate the rename and were not re-verified; confirm against the provider docs.
    provenance:
      kind: provider-api
      source_model_id: "glm-5.3-flash"
      source_url: "https://docs.bigmodel.cn/api-reference/%E6%A8%A1%E5%9E%8B-api/%E5%AF%B9%E8%AF%9D%E8%A1%A5%E5%85%A8"
      verified_on: "2026-08-11"
    # frugality_tier=5 (paid): direct cloud API, billed per token, requires
    # OPENCLAW_MODELS_PROVIDERS_BIGMODEL_APIKEY.
    frugality_tier: 5

  # ── ONLINE: OpenRouter shared-endpoint tiered pipeline defaults ────────────
  # Both aliases use one OpenRouter credential/endpoint. Provider routing on
  # OpenRouter handles upstream replicas; PT handles cross-model/provider
  # fallback from config/pipelines.yml when this adapter is unavailable.
  - name: "openrouter-gpt-4o-mini"
    api_model: "openai/gpt-4o-mini"
    backend: openrouter
    device: cloud
    host: "https://openrouter.ai"
    port: 443
    api_path: "/api/v1/chat/completions"
    context_window: 128000
    roles: [pipeline-fast, classification]
    priority: 3
    online: true
    reasoning: fast-classification
    description: "OpenRouter fast stage default"
    frugality_tier: 5
    provenance:
      kind: provider-api
      source_model_id: "openai/gpt-4o-mini"
      source_url: "https://openrouter.ai/openai/gpt-4o-mini"
      verified_on: "2026-09-16"

  - name: "openrouter-claude-sonnet-4.6"
    api_model: "anthropic/claude-sonnet-4.6"
    backend: openrouter
    device: cloud
    host: "https://openrouter.ai"
    port: 443
    api_path: "/api/v1/chat/completions"
    context_window: 1000000
    roles: [pipeline-strong, strategy, architecture]
    priority: 4
    online: true
    reasoning: strong-generation
    description: "OpenRouter strong stage default"
    frugality_tier: 5
    provenance:
      kind: provider-api
      source_model_id: "anthropic/claude-sonnet-4.6"
      source_url: "https://openrouter.ai/anthropic/claude-sonnet-4.6"
      verified_on: "2026-09-16"

  # ── Priority 05 - LOCAL: Windows LM Studio (v1.0 RC canonical) ────────────
  # Qwen3.5-27B Q4_K_M — GPU Offload=40, Context=16384
  # HF: Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-v2-GGUF
  # Same .gguf loadable in Ollama, koboldcpp, llama.cpp — backend-agnostic
  - name: "qwen3.5-27b-claude-4.6-opus-reasoning-distilled-v2"
    backend: lm-studio
    device: win-rtx3080
    host: "${LM_STUDIO_WIN_ENDPOINT:-http://localhost:1234}"
    port: 1234
    context_window: 16384
    gpu_offload: 40
    roles: [coder, coding, checker, refiner, executor, verifier, subagent, priority-subagent, autoresearch-coder, autoresearch, fallback]
    priority: 5
    online: false
    reasoning: windows-lmstudio
    gguf_file: Qwen3.5-27B.Q4_K_M.gguf
    hf_repo: Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled-v2-GGUF
    description: "Primary Logic, Heavy Coder, Critic, Evaluator"
    tier: "primary"
    # frugality_tier=1 (local_oss): LM Studio on win-rtx3080, LAN-local.
    frugality_tier: 1

  # ── Priority 10 - LOCAL: Mac LM Studio (v1.0 RC canonical) ────────────────
  # Qwen3.5-9B MLX-4bit — Metal full GPU offload, Context=4096 (conservative M2 16GB)
  # HF: mlx-community/Qwen3.5-9B-MLX-4bit
  # Same weights loadable in Ollama (mlx-lm backend)
  - name: Qwen3.5-9B-MLX-4bit
    backend: lm-studio
    device: mac-studio
    host: "${LM_STUDIO_MAC_ENDPOINT:-http://localhost:1234}"
    port: 1234
    context_window: 4096
    gpu_offload: full
    roles: [mac_orchestrator, refiner, verifier, final-validator, presenter, top-level, deep_reasoning]
    priority: 10
    status: "🔵 Preferred Fallback"
    online: false
    reasoning: mac-lmstudio
    hf_repo: mlx-community/Qwen3.5-9B-MLX-4bit
    description: "Mac Orchestrator, Refiner, Verifier"
    tier: "preferred_fallback"
    # frugality_tier=1 (local_oss): LM Studio on mac-studio, local Metal.
    frugality_tier: 1
 
  # ── LOCAL: Windows LM Studio — Gemma 4 26B A4B (MoE) ─────────────────────
  # lmstudio-community/gemma-4-26B-A4B-it-GGUF Q4_K_M ≈ 16.8 GB
  # MoE: 4B active params — lower VRAM pressure than dense 26B
  # XPS 8950 + RTX 3080 10GB: gpu_offload=35 → ~9.5 GB VRAM, rest on 32 GB CPU RAM
  - name: gemma-4-26B-A4B-it-Q4_K_M
    backend: lm-studio
    device: win-rtx3080
    host: "${LM_STUDIO_WIN_ENDPOINT:-http://localhost:1234}"
    port: 1234
    context_window: 16384
    gpu_offload: 35
    roles: [general, coding, executor, subagent, fallback, autoresearch-coder]
    priority: 16
    online: false
    reasoning: windows-lmstudio-gemma4
    gguf_file: gemma-4-26B-A4B-it-Q4_K_M.gguf
    hf_repo: lmstudio-community/gemma-4-26B-A4B-it-GGUF
    notes: "LM Studio community build — optimized for LM Studio, seamless load."
    # frugality_tier=1 (local_oss): LM Studio on win-rtx3080, LAN-local.
    frugality_tier: 1

  # ── LOCAL: Windows LM Studio — Qwen3.8-27B (dense), both Windows GPUs ─────
  # HF: lmstudio-community/Qwen3.8-27B-GGUF (base Qwen/Qwen3.8-27B, Apache-2.0)
  # Q4_K_M = 16.8 GB, so neither card holds it whole: partial offload on both.
  # One routing key per GPU; both send the LM Studio wire ID qwen/qwen3.8-27b.
  # Benchmarks are pending: run hardware/SKILL.md § Benchmark protocol on each
  # node and record the results here before raising priority or adding roles
  # that would displace the Qwen3.5-27B primary.
  - name: qwen3.8-27b-rtx3080
    api_model: qwen/qwen3.8-27b
    backend: lm-studio
    device: win-rtx3080
    host: "${LM_STUDIO_WIN_ENDPOINT:-http://localhost:1234}"
    port: 1234
    context_window: 16384
    gpu_offload: 40          # starting point copied from the Qwen3.5-27B Q4_K_M entry; confirm by benchmark
    roles: [coder, coding, checker, refiner, subagent, fallback]
    priority: 18
    online: false
    reasoning: windows-lmstudio
    gguf_file: Qwen3.8-27B-Q4_K_M.gguf
    hf_repo: lmstudio-community/Qwen3.8-27B-GGUF
    provenance:
      kind: local-deployment
      source_model_id: "qwen/qwen3.8-27b"
      source_url: "https://huggingface.co/lmstudio-community/Qwen3.8-27B-GGUF"
      verified_on: "2026-11-01"
    benchmark:
      status: pending        # pending | measured
      protocol: hardware/SKILL.md#benchmark-protocol
    # frugality_tier=1 (local_oss): LM Studio on win-rtx3080, LAN-local.
    frugality_tier: 1

  - name: qwen3.8-27b-rtx5080
    api_model: qwen/qwen3.8-27b
    backend: lm-studio
    device: win-rtx5080
    host: "${LM_STUDIO_WIN_ENDPOINT:-http://localhost:1234}"
    port: 1234
    context_window: 16384
    # gpu_offload: set from the benchmark; 16 GB VRAM holds more layers than the 3080.
    roles: [coder, coding, checker, refiner, subagent, fallback]
    priority: 17
    online: false
    reasoning: windows-lmstudio
    gguf_file: Qwen3.8-27B-Q4_K_M.gguf
    hf_repo: lmstudio-community/Qwen3.8-27B-GGUF
    provenance:
      kind: local-deployment
      source_model_id: "qwen/qwen3.8-27b"
      source_url: "https://huggingface.co/lmstudio-community/Qwen3.8-27B-GGUF"
      verified_on: "2026-11-01"
    benchmark:
      status: pending
      protocol: hardware/SKILL.md#benchmark-protocol
    # frugality_tier=1 (local_oss): LM Studio on win-rtx5080, LAN-local.
    frugality_tier: 1

  # ── LOCAL: Windows RTX 5080 only — DiffusionGemma 26B-A4B (Gemma 4) NVFP4 ──
  # HF: FreedomAISVR/DiffusionGemma-26B-A4B-it-NVFP4-GGUF
  #     (base google/diffusiongemma-26B-A4B-it, Apache-2.0)
  # Text-to-image block-diffusion MoE (26B total, 4B active), NOT a chat model:
  # its only role is image-generation, so no text role can select it.
  # NVFP4 targets Blackwell, so RTX 5080 only (never the 3080, Ampere).
  # weights 14.4 GB + required vision projector 1.19 GB
  # (mmproj-diffusiongemma-26b-a4b-f16.gguf). Upstream documents llama-server;
  # LM Studio support is unverified. Benchmark later.
  - name: diffusiongemma-26b-a4b-it-nvfp4
    backend: lm-studio
    device: win-rtx5080
    host: "${LM_STUDIO_WIN_ENDPOINT:-http://localhost:1234}"
    port: 1234
    roles: [image-generation]
    priority: 90
    online: false
    reasoning: windows-lmstudio-diffusion
    gguf_file: diffusiongemma-26b-a4b-it-nvfp4.gguf
    mmproj_file: mmproj-diffusiongemma-26b-a4b-f16.gguf
    hf_repo: FreedomAISVR/DiffusionGemma-26B-A4B-it-NVFP4-GGUF
    benchmark:
      status: deferred       # benchmark later, per operator
      protocol: hardware/SKILL.md#benchmark-protocol
    # frugality_tier=1 (local_oss): LM Studio on win-rtx5080, LAN-local.
    frugality_tier: 1

   # ── LOCAL: Shared Ollama (Mac or Win or dedicated server) ─────────────────
  - name: qwen3.5:35b-a3b-q4_K_M
    backend: ollama
    device: shared-ollama
    host: "${OLLAMA_HOST:-http://127.0.0.1}"
    port: 11434
    context_window: 32768
    roles: [general, critic, refiner, fallback, subagent]
    priority: 10
    online: false
    reasoning: local-default
    # frugality_tier=1 (local_oss): shared Ollama host, LAN-local (Mac/Win).
    frugality_tier: 1

  # ── LOCAL: Mac MLX ────────────────────────────────────────────────────────
  - name: qwen3.5-9b-mlx
    backend: mlx
    device: mac-studio
    host: "http://127.0.0.1"
    port: 8081
    context_window: 32768
    roles: [general, top-level, coding, subagent]
    priority: 20
    online: false
    reasoning: mac-local
    # frugality_tier=1 (local_oss): Mac MLX, localhost:8081.
    frugality_tier: 1

 # ── ONLINE: Perplexity sonar-reasoning-pro ───────────────────────────────
  - name: sonar-reasoning-pro
    api_model: sonar-reasoning-pro
    backend: perplexity
    device: cloud
    host: "https://api.perplexity.ai"
    port: 443
    context_window: 128000
    roles: [research, top-level, realtime]
    priority: 40
    online: true
    reasoning: online-research
    # frugality_tier=5 (paid): Perplexity cloud API, billed per token,
    # requires PERPLEXITY_API_KEY.
    frugality_tier: 5
    provenance:
      kind: provider-api
      source_model_id: sonar-reasoning-pro
      source_url: "https://docs.perplexity.ai/docs/sonar/models/sonar-reasoning-pro"
      verified_on: "2026-08-11"

  # ── ONLINE: Claude Sonnet 5.5, medium effort (Anthropic harness default)
  # Dateless API id `claude-sonnet-5-5`. Medium effort is request config,
  # not part of the model ID. See docs/standards/model-governance.md.
  - name: claude-sonnet-5-5
    api_model: claude-sonnet-5-5
    backend: anthropic
    device: cloud
    host: "https://api.anthropic.com"
    port: 443
    context_window: 1000000
    max_tokens: 128000
    roles: [strategy, architecture, top-level, deep_reasoning]
    priority: 50
    online: true
    reasoning: medium-depth
    provider_options:
      output_config:
        effort: medium
    # frugality_tier=5 (paid): Anthropic cloud API, billed per token.
    frugality_tier: 5
    provenance:
      kind: provider-api
      source_model_id: claude-sonnet-5-5
      source_url: "https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions"
      verified_on: "2026-10-03"

  # Legacy Anthropic pin. Allowed at medium; not the harness default.
  - name: claude-sonnet-5
    api_model: claude-sonnet-5
    backend: anthropic
    device: cloud
    host: "https://api.anthropic.com"
    port: 443
    context_window: 1000000
    max_tokens: 128000
    roles: [strategy, architecture, top-level, deep_reasoning]
    priority: 51
    online: true
    reasoning: medium-depth
    provider_options:
      output_config:
        effort: medium
    frugality_tier: 5
    provenance:
      kind: provider-api
      source_model_id: claude-sonnet-5
      source_url: "https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions"
      verified_on: "2026-10-03"

  # ── ONLINE: Grok 4.7 (direct-xAI / last-resort paid tier) ─────────────────
  # grok-4.5 is banned (no default, fallback, or catalog row).
  # Reasoning effort medium is set explicitly (vendor default is high).
  - name: grok-4.7
    api_model: grok-4.7
    backend: xai
    device: cloud
    host: "https://api.x.ai"
    port: 443
    context_window: 500000
    roles: [finance, realtime, market, top-level]
    priority: 60
    online: true
    reasoning: medium-depth
    provider_options:
      reasoning_effort: medium
    # frugality_tier=6 (last_resort): xAI cloud API, billed per token.
    # Ladder order is unchanged: local first, this paid last-resort last.
    frugality_tier: 6
    provenance:
      kind: provider-api
      source_model_id: grok-4.7
      source_url: "https://docs.x.ai/developers/grok-4-7"
      verified_on: "2026-10-23"


  # ── AUTORESEARCH: foot-soldier agents (uditgoenka/autoresearch swarm) ───────────
  # autoresearch-coder: qwen3.5-27b-claude-4.6-opus-reasoning-distilled-v2 on Windows RTX 3080 (CUDA executor)
  #   (macOS systems use qwen3.5-9b-mlx for this role)
  # autoresearch-critic: Qwen3-30B on Dell (evaluator + orchestrator reasoning)
  # Both are LOCAL-only; never route autoresearch tasks to cloud without explicit override.

  - name: qwen3-30b-autoresearch-critic
    backend: ollama
    device: win-rtx3080
    host: "${WIN_OLLAMA_ENDPOINT:-http://localhost:11434}"
    port: 11434
    context_window: 32768
    roles: [autoresearch-critic, critic, refiner, fallback]
    priority: 15
    online: false
    reasoning: windows-local-critic
    notes: "Evaluator + Orchestrator agents for autoresearch swarm. Reads log.txt, writes swarm_state.md."
    # frugality_tier=1 (local_oss): Ollama on win-rtx3080, LAN-local.
    frugality_tier: 1
