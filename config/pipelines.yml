version: 1
enabled: true

# Tier-5 execution is approval-gated. Candidate pools are ordered, validated against
# the canonical model registry, and tried until one real provider request
# confirms adapter, model, endpoint, and credential readiness. Operators can
# prepend an eligible registered model with PIPELINE_<ALIAS>_MODEL.
models:
  fast:
    candidates:
      - openrouter-gpt-4o-mini
      - glm-5.2
      - claude-sonnet-5
  strong:
    candidates:
      - openrouter-claude-sonnet-4.6
      - claude-sonnet-5
      - glm-5.2

recipes:
  classify_then_generate:
    max_total_tokens: 8192
    # Reserved before paid dispatch; the API records this conservative local
    # budget amount only after all configured stages succeed.
    cost_reservation_usd: 0.25
    # A conservative UTF-8-byte upper bound is checked before every paid call.
    max_input_tokens: 8192
    stages:
      - name: classify
        model: fast
        max_tokens: 256
        instruction: >-
          Classify the request and return compact routing context for the
          generator.
      - name: generate
        model: strong
        max_tokens: 4000
        input_from: classify
        instruction: >-
          Produce the final answer using the original request as the primary
          source and the classification as supplemental context.
