schema_version: 1

# Governed Tier-5 recipes. Runtime activation is separately gated by
# PIPELINE_TIERED_ENABLED=1 and a human-bound PipelineApproval record.
# Model slugs are explicit rather than floating aliases so reviewed behavior
# does not change underneath a running deployment.
limits:
  max_pipeline_stages: 3
  max_total_tokens: 4256
  max_total_cost_usd: 0.05
  request_timeout_seconds: 45
  max_retries: 1

models:
  fast:
    provider: openrouter
    model: openai/gpt-5.4-mini
  strong:
    provider: openrouter
    model: anthropic/claude-sonnet-4.6

recipes:
  classify_then_generate:
    stages:
      - name: classify
        model_class: fast
        max_tokens: 256
        inputs: [original]
        instruction: >-
          Classify the request by task shape, risk, and the minimum reasoning
          depth required. Return a compact routing note, not the final answer.
      - name: generate
        model_class: strong
        max_tokens: 4000
        inputs: [original, classify]
        instruction: >-
          Produce the final response using the original request and the prior
          classification. Preserve uncertainty and do not invent missing facts.
