# pyproject.toml — Perpetua-Tools
# Makes PT pip-installable for consistent versioning + dependency pinning
# Mirrors orama-system's pyproject.toml structure (PEP 517/518)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perpetua-tools"
version = "1.1.1.0"
description = "Top-level idempotent multi-agent orchestrator: per-device model selection, fallback routing, cost guard, and orama-system integration."
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
keywords = [
    "multi-agent", "orchestrator", "llm", "ollama", "mlx",
    "fastapi", "ultrathink", "perplexity", "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core frameworks
    # crewai + crewai-tools removed 2026-05-29: zero imports in codebase (vestigial
    # from Perplexity-Tools era); brought in diskcache CVE-2025-69872 via instructor
    # transitive dep and blocked python-dotenv >=1.2.2 (CVE-2026-28684).
    # perplexityai removed 2026-05-29: zero imports; Perplexity is called via
    # the openai-compatible SDK (OPENAI_BASE_URL override) in perplexity_client.py.
    # >=1.83.0: .agent/harness/llm.py's MiniMax/wanDB/OpenAI provider branches
    # pass max_completion_tokens to chat.completions.create() -- absent from
    # this SDK's signature before 1.83.0 (verified directly: openai==1.30.0's
    # create() has zero max_completion_tokens occurrences, raises TypeError
    # on an unexpected kwarg). Matches the version actually locked in uv.lock.
    "openai>=1.83.0",
    # FastAPI web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    # Async and networking
    "aiohttp>=3.14.3",
    "httpx>=0.26.0",
    # src/utils/ssrf_pinned_adapter.py (Layer-2 SSRF pinning transport, PR #359)
    # subclasses urllib3's HTTPConnectionPool/HTTPSConnectionPool via requests.adapters.HTTPAdapter.
    # >=2.32.2: CVE-2024-35195 (Session.verify=False on one request silently disabled cert
    # verification for all later requests to that host); 2.32.0/2.32.1 were yanked over
    # regressions from that fix, 2.32.2 is the first stable release carrying it.
    "requests>=2.32.2",
    "jsonschema>=4.0.0",
    # Database and caching
    "aiosqlite>=0.19",        # GossipBus async SQLite + FTS5 (RAG backport 2026-05-22)
    "redis>=5.0.1",
    "python-multipart>=0.0.31",
    "sqlalchemy>=2.0.25",
    # Data validation
    "pydantic>=2.6.0",
    # Config
    "PyYAML>=6.0.1",
    # Utilities
    "python-dotenv>=1.2.2",  # CVE-2026-28684 symlink overwrite fixed in 1.2.2
    "loguru>=0.7.2",
    "rich>=13.7.0",
    # Security: rate limiting (OWASP API4)
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# mlx group removed 2026-05-29: transformers had 15 active CVEs (ReDoS, arbitrary
# code exec) and zero actual imports in the codebase. huggingface-hub went with it.
# Re-add when an MLX backend is actually implemented.
# ── Highly recommended but optional ────────────────────────────────────────────
# Install everything at once: pip install perpetua-tools[recommended]
# Or pick individually:       pip install perpetua-tools[rag,lan]
recommended = [
    "lancedb>=0.6",
    "pyarrow>=14.0",
    "netifaces>=0.11.0",
]
rag = [
    # Semantic vector store for GossipBus (RAG backport 2026-05-22).
    # Falls back to FTS5-only keyword recall if not installed.
    "lancedb>=0.6",
    "pyarrow>=14.0",
]
lan = [
    # LAN interface detection for NetworkAutoConfig (packages/net_utils/).
    # Falls back to socket-based IP detection if not installed.
    "netifaces>=0.11.0",
]
windows-security = [
    # Windows-only. Enforces a restrictive ACL (owner + Administrators,
    # deny Everyone) on the AlphaClaw TLS cert/key/fingerprint store via
    # orchestrator/alphaclaw_tls_proxy.py's _secure_path_win32(). Falls
    # back to an icacls subprocess if not installed -- see
    # docs/next/2026-07-24-plan-windows-acl-alphaclaw-tls-proxy.md.
    "pywin32>=227; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26.0",   # TestClient transport
    "flake8>=7.0",
    "mypy>=1.8",
    "respx>=0.23.1",   # httpx mocking for tests/discovery/
    "hypothesis>=6.100",   # property-based tests, tests/test_state_transition_manager.py
]

[project.urls]
"Homepage" = "https://github.com/diazMelgarejo/Perpetua-Tools"
"Bug Tracker" = "https://github.com/diazMelgarejo/Perpetua-Tools/issues"
"orama-system" = "https://github.com/diazMelgarejo/orama-system"
"Changelog" = "https://github.com/diazMelgarejo/Perpetua-Tools/blob/main/CHANGELOG.md"

[project.scripts]
pt-orchestrator = "orchestrator.fastapi_app:app"
pt-setup = "perpetua_tools.setup_wizard:main"
pt-launch = "perpetua_tools.agent_launcher:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["orchestrator*", "perpetua*", "perpetua_tools*", "utils*"]
exclude = ["tests*", "vendor*", ".state*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
addopts = "-v --tb=short"
markers = [
    "unit: isolated unit-level regression coverage",
    "integration: tests that exercise multiple components or a service boundary",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E221", "E272"]
exclude = [".git", "__pycache__", "vendor", ".state"]
