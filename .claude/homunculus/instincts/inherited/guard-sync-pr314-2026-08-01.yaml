id: pt-pr-body-read-backup-merge-write
trigger: "when updating Perpetua-Tools PR #314 or any open PR body after new commits"
confidence: 0.97
domain: workflow
source: session-curation
imported_from: "PR_BODY_ANTI_CLOBBER_ENFORCEMENT_PLAN.md"
source_repo: https://github.com/diazMelgarejo/Perpetua-Tools
related_lessons:
  - lesson_3b13ab0a45d4
  - lesson_4a38f0e95fcf
  - lesson_6fff093ccb00
  - lesson_a8f3c2e91d04
title: "PR Body READ → BACKUP → MERGE → WRITE"
action: >-
  Use scripts/cursor/append-pr-body.sh for every PR body update. Workflow:
  gh pr view --json body; save backup; add ## Follow-up below Summary;
  write full merged body. ManagePullRequest update_pr replaces the entire
  field — if you use it, pass the complete integrative body, never
  delta-only. Rule: .cursor/rules/append-only-pr-body.mdc (alwaysApply).
evidence: >-
  PT #314 clobbered 2026-08-01: original guard-sync Summary erased by
  delta-only update_pr for CodeRabbit 4833493387. Restored with Summary +
  three Follow-up sections + CodeRabbit tail preserved.

