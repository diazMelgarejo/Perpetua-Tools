title: "PT Guard Scripts Are Downstream Mirrors — Sync From Orama"
action: >-
  Never hand-edit Perpetua-Tools scripts/git guard copies. Change orama
  canonical first, then bash ../orama-system/scripts/git/sync-attribution-guard-scripts.sh .
  Verify with bash scripts/git/verify-guard-parity.sh ../orama-system .
