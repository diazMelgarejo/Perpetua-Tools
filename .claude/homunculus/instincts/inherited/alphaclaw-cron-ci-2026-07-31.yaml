id: alphaclaw-cherry-pick-conflict-marker-gate
trigger: "when continuing a git cherry-pick after resolving conflicts"
confidence: 0.9
domain: git
source: inherited
imported_from: "ALPHACLAW_UPSTREAM_SYNC_CRON_CI_2026-07-31.md"
source_repo: https://github.com/diazMelgarejo/AlphaClaw
title: "Cherry-Pick Conflict Marker Gate"
action: >-
  Before cherry-pick --continue, require BOTH git diff --name-only
  --diff-filter=U (or git ls-files -u) returning no paths -- the
  authoritative index-level check, since rename/delete and add/add
  conflicts leave no textual markers -- and a supplemental scan of every
  staged file for conflict markers (<<<<<<<, =======, >>>>>>>), since the
  index can be clean while a marker was accidentally staged as literal
  content. If markers shipped, rewrite history (reset + clean
  cherry-pick) rather than patching in a follow-up commit.
evidence: >-
  garrytan cherry-pick left markers in vitest.config.js at commit
  72a090d. User caught; history rewritten to f2d9abf + 587b627 before PR
  #22 merge.

