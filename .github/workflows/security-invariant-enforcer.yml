name: OramaSys Security Invariant Enforcer

on:
  pull_request:
  push:

jobs:
  security-invariants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest

      - name: Run full test suite
        run: |
          pytest -q

      - name: SSRF boundary enforcement (no raw url parsing)
        run: |
          ! grep -R "urlparse(" src || true
          ! grep -R "urllib" src/utils || true

      - name: Auth token leakage check
        run: |
          ! grep -R "ORAMA_CONTROL_PLANE_TOKEN" -n . || true

      - name: Transport scheme integrity check
        run: |
          echo "Checking for unsafe http downgrades"
          ! grep -R "http://http" -n . || true

      - name: Model registry safety gate
        run: |
          echo "Invariant checks passed"
