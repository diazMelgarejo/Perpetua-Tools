name: PT 389 fresh reconcile once

on:
  push:
    branches:
      - compare/pt389-current-main-reconcile-20260913

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fresh current-main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: compare/pt389-current-main-reconcile-20260913
          persist-credentials: true

      - name: Fetch historical source branch
        run: git fetch origin docs/pt-memory-complete-afrp-cidf-20260912

      - name: Reconcile append-only memory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          OLD = 'origin/docs/pt-memory-complete-afrp-cidf-20260912'
          EP = Path('.agent/memory/episodic/AGENT_LEARNINGS.jsonl')
          SEM = Path('.agent/memory/semantic/lessons.jsonl')

          def git_show(ref: str, path: Path) -> str:
              return subprocess.check_output(['git', 'show', f'{ref}:{path.as_posix()}'], text=True)

          # Preserve only historical episodic rows that are genuinely absent from
          # current main. Exact-line identity is used because the file is append-only.
          current_ep = EP.read_text(encoding='utf-8').splitlines()
          old_ep = git_show(OLD, EP).splitlines()
          seen = set(current_ep)
          additions = [line for line in old_ep if line.strip() and line not in seen]
          if additions:
              EP.write_text('\n'.join(current_ep + additions) + '\n', encoding='utf-8')

          # Preserve semantic lessons by stable lesson id, never by three-dot diff.
          current_sem_lines = SEM.read_text(encoding='utf-8').splitlines()
          current_ids = {json.loads(x)['id'] for x in current_sem_lines if x.strip()}
          old_sem_lines = git_show(OLD, SEM).splitlines()
          sem_add = []
          for line in old_sem_lines:
              if not line.strip():
                  continue
              obj = json.loads(line)
              if obj['id'] not in current_ids:
                  sem_add.append(line)
                  current_ids.add(obj['id'])
          if sem_add:
              SEM.write_text('\n'.join(current_sem_lines + sem_add) + '\n', encoding='utf-8')

          # CodeRabbit review 5187278219 correctly identified the 2026-09-12
          # confidence-0.95 closure row as unsupported by its evidence_ids. Keep that
          # historical row immutable and append a superseding authority snapshot.
          api_items = [
              ('diazMelgarejo/orama-system', 356),
              ('oramasys/agate', 3),
              ('oramasys/perpetua-core', 4),
              ('oramasys/oramasys', 11),
              ('oramasys/telos', 1),
              ('oramasys/phylax', 1),
              ('oramasys/Claude-Desktop-LLM', 1),
              ('diazMelgarejo/Perpetua-Tools', 388),
          ]
          token = os.environ.get('GH_TOKEN', '')
          headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'pt389-reconcile'}
          if token:
              headers['Authorization'] = f'Bearer {token}'
          snapshot = []
          for repo, number in api_items:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{number}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  pr = json.load(resp)
              snapshot.append({
                  'repository': repo,
                  'pr': number,
                  'state': pr.get('state'),
                  'merged': pr.get('merged'),
                  'merged_at': pr.get('merged_at'),
                  'merge_commit_sha': pr.get('merge_commit_sha'),
                  'base_ref': pr.get('base', {}).get('ref'),
                  'base_sha': pr.get('base', {}).get('sha'),
                  'head_ref': pr.get('head', {}).get('ref'),
                  'head_sha': pr.get('head', {}).get('sha'),
              })

          now = dt.datetime.now(dt.timezone.utc).isoformat()
          action = 'supersede:migration-debt-and-afrp-cidf-closure-20260912'
          rows = [json.loads(line) for line in EP.read_text(encoding='utf-8').splitlines() if line.strip()]
          if not any(r.get('action') == action for r in rows):
              record = {
                  'timestamp': now,
                  'skill': 'memory-manager',
                  'action': action,
                  'result': 'historical-authority-snapshot',
                  'detail': 'Supersedes the interpretation of the earlier confidence-0.95 closure record. This is a historical snapshot only; every future consequential action must freshly re-read live authority.',
                  'pain_score': 2,
                  'importance': 10,
                  'reflection': 'The prior record cited an unrelated review lesson and therefore could not support current closure. This append-only superseding record carries per-repository PR identity, refs, SHAs, and merge state and explicitly expires as current authority after observation.',
                  'confidence': 0.99,
                  'source': {'skill': 'memory-manager', 'profile': 'authority-reconciliation', 'run_id': 'pr389-fresh-reconcile'},
                  'evidence_ids': ['lesson_93c1b7416ff3', 'lesson_d7a13d8bc5fb'],
                  'supersedes_timestamp': '2026-09-12T05:19:34.769039+00:00',
                  'authority_snapshot_observed_at': now,
                  'authority_snapshot': snapshot,
                  'current_authority': False,
              }
              with EP.open('a', encoding='utf-8') as fh:
                  fh.write(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
          python3 .agent/memory/render_lessons.py

      - name: Validate reconciled memory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.agent/memory').rglob('*.jsonl'):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      json.loads(line)
          ep = Path('.agent/memory/episodic/AGENT_LEARNINGS.jsonl').read_text(encoding='utf-8')
          assert 'supersede:migration-debt-and-afrp-cidf-closure-20260912' in ep
          sem = Path('.agent/memory/semantic/lessons.jsonl').read_text(encoding='utf-8')
          assert 'lesson_93c1b7416ff3' in sem
          print('JSONL + superseding authority record: PASS')
          PY
          python3 scripts/review/repo_hygiene.py .
          python3 -m unittest discover -s tests -p test_periscope_lesson_supersession.py -v
          git diff --check

      - name: Commit durable memory only and remove runner
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent/memory
          git rm .github/workflows/pt389-fresh-reconcile-once.yml
          git diff --cached --check
          git commit -m 'docs(memory): reconcile AFRP closure evidence from current main'
          git push origin HEAD:compare/pt389-current-main-reconcile-20260913
