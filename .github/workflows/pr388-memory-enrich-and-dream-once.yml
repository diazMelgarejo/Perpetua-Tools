name: PR 388 memory enrich and dream once

on:
  push:
    branches:
      - docs/memory-corruption-incidents-remote-integrity-20260912

permissions:
  contents: write

concurrency:
  group: pr388-memory-enrich-dream
  cancel-in-progress: false

jobs:
  enrich-and-dream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/memory-corruption-incidents-remote-integrity-20260912
          persist-credentials: true

      - name: Enrich and dream
        run: |
          set -euo pipefail
          python3 -m py_compile .agent/tools/pr388_enrich_once.py .agent/memory/*.py
          python3 .agent/tools/pr388_enrich_once.py

      - name: Validate memory outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.agent/memory/semantic/DOMAIN_KNOWLEDGE.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python3 .agent/memory/render_lessons.py
          python3 scripts/review/repo_hygiene.py
          python3 -m unittest discover -s tests -p test_periscope_lesson_supersession.py -v
          git diff --check

      - name: Commit memory outputs and remove one-shot runner
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent/memory
          git rm .agent/tools/pr388_enrich_once.py
          git rm .github/workflows/pr388-memory-enrich-and-dream-once.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No enrichment changes and one-shot files already absent.'
            exit 0
          fi
          git commit -m 'docs(memory): enrich PR 388 incident knowledge and dream'
          git push origin HEAD:docs/memory-corruption-incidents-remote-integrity-20260912
