name: OramaSys Invariant Monitor Bot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pyyaml
          pip install fastapi aiohttp redis httpx python-dotenv loguru pydantic slowapi respx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run transport invariant tests
        run: |
          pytest tests/test_scheme_preservation.py \
            tests/test_hardware_routing.py::test_active_tilting_ollama_win_uses_model_port_not_lmstudio \
            tests/test_model_endpoint_url.py -q --tb=short
        env:
          ORAMA_ENABLED: "false"

      - name: Detect transport regression (http://http in source)
        run: |
          if grep -R --include='*.py' -n 'http://http' orchestrator src; then
            echo "FAIL: http://http transport mojibake in production Python"
            exit 1
          fi
          echo "OK: no http://http in orchestrator/ or src/"

      - name: Comment on PR if failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## OramaSys Invariant Monitor Alert

Transport or endpoint-policy invariants failed. See the workflow log for details.

- \`tests/test_scheme_preservation.py\` — scheme-preserving active_tilting rebuild
- \`tests/test_model_endpoint_url.py\` — SSRF / endpoint policy boundary`
            })
